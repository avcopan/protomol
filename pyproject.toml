[project]
name = "protomol"
version = "0.0.0"
readme = "README.md"  # the PyPI page
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Andreas V. Copan", email = "avcopan@uga.edu"}]
dependencies = [
    "more-itertools>=11.2.1",
    "networkx>=3.7",
    "numpy>=2.5.5",
    "pydantic>=2.14.4",
    "rdkit>=2026.9.2",
    "typing-extensions>=4.16.0",
]
requires-python = ">= 3.13"

[project.urls]
Repository = "https://github.com/avcopan/protomol"
Documentation = "https://avcopan.github.io/protomol/"

[build-system]
build-backend = "uv_build"
requires = ["uv_build"]

# Ruff configurations
[tool.ruff]
extend-exclude = [".agents", ".claude"]  # vendored agent skills

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # missing trailing comma (handled by format)
    "TID252",   # relative import
    "D203",     # conflict: incorrect blank line before class (uses D211 instead)
    "D213",     # conflict: multi-line summary second line (uses D212 instead)
    "CPY001",   # copyright notice
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101", "PLR2004"]  # assert, magic values

[tool.ruff.lint.pydocstyle]
convention = "google"

# Ty configurations
[tool.ty.environment]
python = ".pixi/envs/test/bin/python"

[tool.ty.src]
include = [
    "src",
    "tests",
]

# Import-linter configurations
[tool.importlinter]
root_package = "protomol"

[[tool.importlinter.contracts]]
name = "Module Layering"
type = "layers"
layers = [
    "protomol.layer2",
    "protomol.layer1",
]

# Pytest configurations
[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = [
    "--doctest-modules",
    "--cov=protomol",
    "--cov-report=term-missing",
    "--cov-report=html",
]
doctest_optionflags = "NORMALIZE_WHITESPACE"

# Pytest-cov configurations
[tool.coverage.run]
branch = true
source = ["protomol"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
